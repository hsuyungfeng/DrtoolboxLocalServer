{% extends 'base.html' %}

{% block title %}多通路評論管理 - 診所管理系統{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title">多通路評論管理</h2>
        <div>
            <button class="btn btn-outline-primary btn-sm me-2" onclick="syncGoogleReviews()">🔄 同步 Google 評論</button>
            <select class="form-select form-select-sm d-inline-block w-auto" id="status-filter" onchange="fetchComments()">
                <option value="pending">待處理</option>
                <option value="replied">已回覆</option>
            </select>
        </div>
    </div>

    <div id="comments-list" class="row g-4">
        <!-- 評論清單會在此動態生成 -->
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">載入評論中...</p>
        </div>
    </div>
</div>

<!-- 回覆編輯 Modal -->
<div class="modal fade" id="replyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">📝 編輯 AI 建議回覆</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small text-muted">原始評論內容</label>
                    <div id="modal-original-content" class="p-3 bg-black rounded border border-secondary mb-3"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">AI 建議回覆</label>
                    <textarea id="modal-reply-text" class="form-control bg-dark text-light border-secondary" rows="8"></textarea>
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" id="btn-approve-reply">核准並發送</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentCommentId = null;

    async function fetchComments() {
        const status = document.getElementById('status-filter').value;
        const container = document.getElementById('comments-list');
        
        try {
            const resp = await fetch(`/api/v1/external/list?status=${status}`);
            const result = await resp.json();
            
            if (result.success) {
                if (result.data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center py-5 text-muted">目前沒有待處理的評論</div>';
                    return;
                }
                
                container.innerHTML = result.data.map(item => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0 bg-dark text-light">
                            <div class="card-header bg-transparent border-secondary d-flex justify-content-between align-items-center">
                                <span class="badge ${getPlatformBadge(item.platform)}">${item.platform}</span>
                                <small class="text-muted">${new Date(item.created_at).toLocaleDateString()}</small>
                            </div>
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-2">
                                    <strong class="me-2">${item.author_name}</strong>
                                    ${item.rating ? `<span class="text-warning">${'★'.repeat(item.rating)}${'☆'.repeat(5-item.rating)}</span>` : ''}
                                </div>
                                <p class="card-text small text-info mb-3">"${item.content}"</p>
                                <div class="bg-black p-2 rounded small border border-secondary mb-3" style="max-height: 100px; overflow:hidden; text-overflow:ellipsis;">
                                    <span class="text-muted">AI 建議：</span><br>
                                    ${item.ai_draft_reply || '無建議'}
                                </div>
                                <button class="btn btn-primary btn-sm w-100" onclick="openReplyModal(${item.id}, '${item.content.replace(/'/g, "\\'")}', \`${item.ai_draft_reply ? item.ai_draft_reply.replace(/`/g, "\\`") : ''}\`)">
                                    ${item.status === 'pending' ? '處理回覆' : '查看詳情'}
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) {
            container.innerHTML = `<div class="alert alert-danger">載入失敗: ${e.message}</div>`;
        }
    }

    function getPlatformBadge(p) {
        switch(p) {
            case 'google_maps': return 'bg-danger';
            case 'facebook_comment': return 'bg-primary';
            case 'web': return 'bg-info';
            default: return 'bg-secondary';
        }
    }

    function openReplyModal(id, content, draft) {
        currentCommentId = id;
        document.getElementById('modal-original-content').textContent = content;
        document.getElementById('modal-reply-text').value = draft;
        
        const modal = new bootstrap.Modal(document.getElementById('replyModal'));
        
        document.getElementById('btn-approve-reply').onclick = async () => {
            const text = document.getElementById('modal-reply-text').value;
            const btn = document.getElementById('btn-approve-reply');
            btn.disabled = true;
            btn.textContent = '發送中...';
            
            try {
                const resp = await fetch('/api/v1/external/approve', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: currentCommentId, reply_text: text })
                });
                const res = await resp.json();
                if (res.success) {
                    alert('回覆成功！');
                    modal.hide();
                    fetchComments();
                } else {
                    alert('失敗: ' + (res.error || '原因未知'));
                }
            } catch (e) { alert('連線失敗'); }
            finally { 
                btn.disabled = false;
                btn.textContent = '核准並發送';
            }
        };
        
        modal.show();
    }

    async function syncGoogleReviews() {
        try {
            const resp = await fetch('/api/v1/external/sync', { method: 'POST' });
            const res = await resp.json();
            alert(res.message);
            fetchComments();
        } catch (e) { alert('同步失敗'); }
    }

    document.addEventListener('DOMContentLoaded', fetchComments);
</script>
{% endblock %}
